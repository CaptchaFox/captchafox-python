[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "captchafox-python"
version = "1.0.0"
description = "Verifies CaptchaFox tokens with siteverify."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Scoria Labs GmbH" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://captchafox.com"
Source = "https://github.com/CaptchaFox/captchafox-python"

[tool.hatch.build.targets.wheel]
packages = ["src/captchafox"]
